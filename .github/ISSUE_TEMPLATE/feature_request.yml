name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - CVN PSA
        - CVN-ERP
        - MSP Backups
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the product footer or on the About page.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter for your work?
